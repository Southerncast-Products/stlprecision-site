    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What types of metal castings does St. Louis Precision produce?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We produce a full range of ferrous and non-ferrous castings including gray iron (ASTM A48), ductile iron (ASTM A536), MEEHANITE® irons, abrasion resistant white irons (NiHard, ASTM A532), Ni-Resist irons (ASTM A439 D-2 & D-5), plain carbon steels (10XX, WCB), low alloy steels (41XX, 86XX), tool steels (H13, D2), stainless steel (300 and 400 series), and C87500 bronze."
          }
        },
        {
          "@type": "Question",
          "name": "What is the minimum order quantity for castings?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We specialize in short-run production and can produce as few as 1 piece up to 500 pieces per run. We also offer rapid prototyping services for testing designs before full production."
          }
        },
        {
          "@type": "Question",
          "name": "Is St. Louis Precision a MEEHANITE® licensed foundry?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "What molding processes does St. Louis Precision use?",
          "acceptedAnswer": {
            "@type": "Answer",

        }
