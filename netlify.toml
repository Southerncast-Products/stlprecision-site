[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Admin API (quote inbox) — must come before the SPA catch-all
[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200
  force = true

# Single-page app: every other path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
